<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — SpeedX Parcel Delivery</title>
<link rel="icon" href="Images/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

  :root{
    --secondary:#FF7A29;
    --secondary-deep:#FF9752;
    --secondary-text:#1A1006;

    --page-bg:#0E0E11;
    --surface:#18181C;
    --surface-alt:#212126;
    --text:#F5F3EF;
    --text-muted:#A9A7A6;
    --text-faint:#78767A;
    --border:rgba(245,243,239,0.10);
    --border-a:rgba(255,122,41,0.35);
    --tint:rgba(255,122,41,0.06);
    --gradient:linear-gradient(135deg, var(--secondary) 0%, var(--secondary-deep) 100%);

    --display:'Space Grotesk', sans-serif;
    --body-font:'Inter', sans-serif;
    --mono:'Space Mono', monospace;

    --radius-lg:28px;
    --shadow-card:0 24px 60px rgba(255,122,41,0.35);
  }

  body.light{
    --secondary:#FF7A29;
    --secondary-deep:#E8600D;
    --secondary-text:#FFFFFF;

    --page-bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-alt:#EAE6DC;
    --text:#14141A;
    --text-muted:#6B6863;
    --text-faint:#948F87;
    --border:rgba(20,20,26,0.10);
    --border-a:rgba(255,122,41,0.30);
    --tint:rgba(255,122,41,0.09);

    --shadow-card:0 24px 60px rgba(255,122,41,0.25);
  }

  *, *::before, *::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:var(--body-font);
    background:var(--surface);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  h1,h2{font-family:var(--display);color:var(--text);line-height:1.15;}
  :focus-visible{ outline:3px solid var(--secondary); outline-offset:3px; }
  body[dir="rtl"]{ direction:rtl; }

  
  .auth-page{
    width:100vw;height:100vh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative;
    background:var(--page-bg);
    background-image:
      radial-gradient(ellipse 60% 55% at 50% 45%, var(--tint) 0%, transparent 70%);
    transition:background .25s ease;
  }

  
  .ctrl-row{
    position:fixed;top:24px;inset-inline-end:24px;
    display:flex;gap:10px;z-index:999;
  }
  .icon-toggle{
    width:34px;height:34px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:0.8rem;color:var(--secondary);
    border:1px solid var(--secondary);background:transparent;cursor:pointer;
    transition:color .15s ease, border-color .15s ease, transform .2s ease;
  }
  .icon-toggle:hover{color:var(--secondary-deep);border-color:var(--secondary-deep);}
  .icon-toggle:active{transform:scale(0.92);}

  
  .auth-card{
    position:relative;z-index:1;
    width:100%;max-width:420px;
    max-height:calc(100vh - 48px);
    overflow:hidden;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:34px 36px 30px;
    box-shadow:var(--shadow-card);
  }
  .auth-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:var(--gradient);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  }

  
  .auth-logo{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin-bottom:6px;cursor:pointer;
  }
  .auth-logo-mark{
    width:32px;height:32px;border-radius:9px;flex:none;
    background:var(--secondary);color:var(--secondary-text);
    display:flex;align-items:center;justify-content:center;font-size:0.9rem;
  }
  .auth-logo-text{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--text);}

  .auth-subtitle{
    text-align:center;color:var(--text-muted);
    font-size:0.84rem;margin-bottom:18px;
  }

  .auth-title{
    font-family:var(--display);
    font-size:1.55rem;font-weight:600;
    color:var(--secondary);text-align:center;
    margin-bottom:20px;
  }

  
  .auth-field{ margin-bottom:16px; }
  .auth-field label{
    display:block;font-size:0.82rem;font-weight:600;
    color:var(--text);margin-bottom:6px;
  }
  .auth-field input{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:var(--surface-alt);color:var(--text);
    font-family:var(--body-font);font-size:0.94rem;
    outline:none;box-sizing:border-box;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  body[dir="rtl"] .auth-field input{ text-align:right; }
  .auth-field input:focus{
    border-color:var(--secondary);
    box-shadow:0 0 0 4px rgba(255,122,41,0.14);
  }
  .auth-field input::placeholder{ color:var(--text-faint); }

  .auth-pwd-wrap{ position:relative; }
  .auth-pwd-wrap input{ padding-inline-end:46px; }
  .auth-pwd-toggle{
    position:absolute;top:50%;inset-inline-end:14px;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;
    color:var(--text-faint);font-size:0.9rem;
    display:flex;align-items:center;justify-content:center;
    width:22px;height:22px;padding:0;
    z-index:2;
  }
  .auth-pwd-toggle:hover{ color:var(--secondary); }

  /* Hide native browser password-reveal icons (Edge/Chrome on Windows show their own eye
     icon inside type="password" fields, which was stacking with our custom icon) */
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear{
    display:none;
  }
  input::-webkit-credentials-auto-fill-button,
  input::-webkit-strong-password-auto-fill-button{
    display:none !important;
    visibility:hidden;
    pointer-events:none;
    position:absolute;
    right:0;
  }

  .auth-meta-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;flex-wrap:wrap;gap:10px;
  }
  .auth-remember{
    display:inline-flex;align-items:center;gap:8px;
    font-size:0.82rem;color:var(--text-muted);cursor:pointer;user-select:none;
  }
  .auth-remember input{ width:16px;height:16px;accent-color:var(--secondary);cursor:pointer; }
  .auth-forgot{
    font-size:0.82rem;font-weight:600;color:var(--secondary);cursor:pointer;
  }
  .auth-forgot:hover{ color:var(--secondary-deep); }

  
  .auth-btn{
    width:100%;padding:14px;
    background:var(--secondary);color:#FFFFFF;
    border:none;border-radius:999px;
    font-family:var(--body-font);font-size:0.92rem;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow-card);
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:20px;
    transition:transform .15s ease, background .15s ease;
  }
  .auth-btn:hover{ transform:translateY(-2px); background:var(--secondary-deep); }

  
  .auth-divider{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;
    font-size:0.76rem;color:var(--secondary);
  }
  .auth-divider::before,
  .auth-divider::after{ content:''; flex:1; height:1px; background:var(--secondary); }

  
  .auth-social{ display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px; }
  .auth-social-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 10px;
    border:1.5px solid var(--border);border-radius:12px;
    background:var(--surface-alt);color:var(--text);
    font-family:var(--body-font);font-size:0.84rem;font-weight:600;cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  .auth-social-btn:hover{ border-color:var(--secondary); background:var(--tint); }
  .auth-social-btn.google:hover{ border-color:var(--text); }
  .auth-social-btn.apple:hover{ border-color:var(--text); }
  .auth-social-btn i{ font-size:1rem; }

  .auth-switch{ text-align:center; font-size:0.84rem; color:var(--text-muted); }
  .auth-switch a{ color:var(--secondary); font-weight:600; }
  .auth-switch a:hover{ color:var(--secondary-deep); }

  
  @media (max-width:639px){
    .auth-card{ max-width:100%; padding:26px 20px 22px; border-radius:20px; }
    .auth-logo-text{ font-size:1.02rem; }
    .auth-logo-mark{ width:28px; height:28px; font-size:0.8rem; }
    .auth-subtitle{ font-size:0.78rem; margin-bottom:14px; }
    .auth-title{ font-size:1.35rem; margin-bottom:16px; }
    .auth-field{ margin-bottom:13px; }
    .auth-field label{ font-size:0.78rem; margin-bottom:5px; }
    .auth-field input{ padding:11px 14px; font-size:0.87rem; border-radius:10px; }
    .auth-meta-row{ margin-bottom:16px; }
    .auth-remember{ font-size:0.78rem; }
    .auth-forgot{ font-size:0.78rem; }
    .auth-btn{ padding:12px; font-size:0.86rem; margin-bottom:16px; }
    .auth-divider{ margin-bottom:14px; }
    .auth-social{ grid-template-columns:1fr; gap:8px; margin-bottom:14px; }
    .auth-switch{ font-size:0.78rem; }
    .ctrl-row{ top:12px; inset-inline-end:12px; gap:6px; }
    .icon-toggle{ width:32px; height:32px; font-size:0.74rem; }
  }

  
  @media (min-width:640px) and (max-width:1023px){
    .auth-page{ padding:32px; }
    .auth-card{ max-width:440px; padding:38px 40px 34px; border-radius:24px; }
    .auth-subtitle{ margin-bottom:20px; }
    .auth-title{ font-size:1.65rem; margin-bottom:22px; }
    .auth-field{ margin-bottom:18px; }
    .ctrl-row{ top:20px; inset-inline-end:20px; }
    .icon-toggle{ width:38px; height:38px; }
  }

  
  @media (min-width:1024px) and (max-width:1279px){
    .auth-page{ padding:32px; }
    .auth-card{ max-width:420px; padding:34px 36px 30px; border-radius:24px; }
    .auth-field{ margin-bottom:16px; }
  }

  
  @media (min-width:1280px){
    .auth-page{ padding:48px; }
    .auth-card{ max-width:440px; padding:40px 44px 36px; border-radius:28px; }
    .auth-subtitle{ font-size:0.88rem; margin-bottom:22px; }
    .auth-title{ font-size:1.75rem; margin-bottom:24px; }
    .auth-field{ margin-bottom:18px; }
    .ctrl-row{ top:28px; inset-inline-end:28px; gap:12px; }
    .icon-toggle{ width:42px; height:42px; }
  }

  /* Height safety net — login has just 2 fields so there's far less pressure
     than signup, but this still keeps things safe (and never scrolling) on
     very short viewports like Nest Hub (1024×600). */
  @media (max-height:680px){
    .auth-card{ padding:20px 26px 18px; }
    .auth-logo{ margin-bottom:4px; }
    .auth-subtitle{ font-size:0.78rem; margin-bottom:10px; }
    .auth-title{ font-size:1.3rem; margin-bottom:12px; }
    .auth-field{ margin-bottom:10px; }
    .auth-field label{ font-size:0.78rem; margin-bottom:4px; }
    .auth-field input{ padding:10px 14px; font-size:0.86rem; }
    .auth-meta-row{ margin-bottom:12px; }
    .auth-remember{ font-size:0.78rem; }
    .auth-forgot{ font-size:0.78rem; }
    .auth-btn{ margin-bottom:12px; padding:11px; font-size:0.86rem; }
    .auth-divider{ margin-bottom:12px; font-size:0.72rem; }
    .auth-social{ margin-bottom:12px; }
    .auth-social-btn{ padding:9px 10px; font-size:0.8rem; }
    .auth-switch{ font-size:0.78rem; }
  }

  @media (max-height:480px){
    .auth-card{ padding:16px 24px 14px; }
    .auth-logo{ margin-bottom:2px; }
    .auth-subtitle{ font-size:0.76rem; margin-bottom:6px; }
    .auth-title{ font-size:1.2rem; margin-bottom:8px; }
    .auth-field{ margin-bottom:6px; }
    .auth-field label{ font-size:0.7rem; margin-bottom:2px; }
    .auth-field input{ padding:9px 12px; }
    .auth-btn{ margin-bottom:0; padding:9px; }
  }

  /* Only if a viewport is shorter still (well below any real Nest Hub /
     tablet-landscape / phone-landscape size) would the divider and social
     row need to drop — this is a genuine last resort, not something a
     2-field login form should normally ever hit. */
  @media (max-height:420px){
    .auth-divider,
    .auth-social{ display:none; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
    html{ scroll-behavior:auto; }
    .auth-btn:hover{ transform:none; }
  }
</style>
</head>
<body class="dark">

<div class="ctrl-row">
  <button id="langToggle" class="icon-toggle" type="button" aria-label="Toggle text direction"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
  <button id="themeToggle" class="icon-toggle" type="button" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
</div>

<div class="auth-page">
  <div class="auth-card">

    <a href="index.html" class="auth-logo" aria-label="SpeedX">
      <span class="auth-logo-mark"><i class="fa-solid fa-truck-fast"></i></span>
      <span class="auth-logo-text">SpeedX</span>
    </a>
    <p class="auth-subtitle">Fast, reliable parcel delivery.</p>

    <h2 class="auth-title">Welcome Back</h2>

    <form id="loginForm" novalidate>

      <div class="auth-field">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>

      <div class="auth-field">
        <label for="loginPassword">Password</label>
        <div class="auth-pwd-wrap">
          <input type="password" id="loginPassword" placeholder="Enter your password" required minlength="6">
          <button type="button" class="auth-pwd-toggle" id="loginPwdToggle" aria-label="Show password">
            <i class="fa-solid fa-eye" id="loginPwdIcon"></i>
          </button>
        </div>
      </div>

      <div class="auth-meta-row">
        <label class="auth-remember">
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <a href="#" class="auth-forgot">Forgot password?</a>
      </div>

      <button type="submit" class="auth-btn" id="loginSubmitBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Log In
      </button>
    </form>

    <div class="auth-divider">or continue with</div>

    <div class="auth-social">
      <button type="button" class="auth-social-btn google" onclick="socialLogin('Google')"><i class="fa-brands fa-google"></i> Google</button>
      <button type="button" class="auth-social-btn apple" onclick="socialLogin('Apple')"><i class="fa-brands fa-apple"></i> Apple</button>
    </div>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Create account</a></p>

  </div>
</div>

<script>
(function(){
  var THEME_KEY = 'swiftbox-theme';
  var RTL_KEY = 'swiftbox-rtl';
  var body = document.body;
  var themeBtn = document.getElementById('themeToggle');
  var langBtn = document.getElementById('langToggle');

  function applyTheme(theme){
    var isLight = theme === 'light';
    body.classList.toggle('light', isLight);
    body.classList.toggle('dark', !isLight);
    if(themeBtn){
      themeBtn.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      themeBtn.setAttribute('aria-pressed', String(isLight));
    }
  }
  function applyDir(isRtl){
    body.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    if(langBtn){
      langBtn.setAttribute('aria-label', isRtl ? 'Switch to left-to-right' : 'Switch to right-to-left');
      langBtn.setAttribute('aria-pressed', String(isRtl));
    }
  }

  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
  applyDir(localStorage.getItem(RTL_KEY) === 'true');

  if(themeBtn){
    themeBtn.addEventListener('click', function(){
      var next = body.classList.contains('light') ? 'dark' : 'light';
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    });
  }
  if(langBtn){
    langBtn.addEventListener('click', function(){
      var next = body.getAttribute('dir') !== 'rtl';
      applyDir(next);
      localStorage.setItem(RTL_KEY, String(next));
    });
  }
  window.addEventListener('storage', function(e){
    if(e.key === THEME_KEY){ applyTheme(e.newValue || 'dark'); }
    if(e.key === RTL_KEY){ applyDir(e.newValue === 'true'); }
  });

  var toggleBtn = document.getElementById('loginPwdToggle');
  var passwordInput = document.getElementById('loginPassword');
  var toggleIcon = document.getElementById('loginPwdIcon');
  if(toggleBtn && passwordInput){
    toggleBtn.addEventListener('click', function(){
      var isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      if(toggleIcon){ toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'; }
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  }

  var form = document.getElementById('loginForm');
  var submitBtn = document.getElementById('loginSubmitBtn');

  if(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(!form.checkValidity()){ return; }
      submitBtn.disabled = true;
      setTimeout(function(){
        submitBtn.disabled = false;
        window.location.href = 'dashboard.html';
      }, 1000);
    });
  }

  window.socialLogin = function(provider){
    alert('Redirecting to ' + provider + ' OAuth…\n(Wire up your handler here.)');
  };
})();
</script>

</body>
</html>
